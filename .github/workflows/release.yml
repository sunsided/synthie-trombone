name: Release

# Push a version tag (v0.1.0, or v0.1.0-rc.1 for a prerelease) to build the
# `synthie-trombone` terminal app for Linux, macOS and Windows and create a
# GitHub release with generated notes and the archives attached. The tag must
# match the workspace version in Cargo.toml.
#
# Publishing the library to crates.io uses trusted publishing and stays off
# until the repository variable PUBLISH_CRATES is "true": the first release of
# a crate has to be published by hand before a trusted publisher can be set up
# on crates.io (environment `crates-io`, this workflow).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Manual runs build every target (artifacts only), without releasing.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify tag matches workspace version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag and Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "synthie-trombone") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: ${{ matrix.target }}
    needs: [verify-tag, ci]
    # Run when verify-tag passed, or was skipped on a manual run.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # Template values reach the scripts as environment variables, never
    # inlined into the shell source.
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ALSA development libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No build cache on purpose: this workflow publishes what it builds.

      - name: Build
        shell: bash
        run: cargo build --release --locked -p synthie-trombone-cli --target "$TARGET"

      - name: Package
        shell: bash
        run: |
          name="synthie-trombone-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          bin="target/$TARGET/release/synthie-trombone"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE NOTICE-pink-trombone "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job with write access to the repository; it runs no project code.
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "${TAG#v}")
          # A suffix like -rc.1 marks a prerelease.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*

  publish-crate:
    name: Publish synthie-trombone to crates.io
    # After the GitHub release, so a failed release doesn't leave a published crate behind.
    needs: release
    if: github.ref_type == 'tag' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for a crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p synthie-trombone --locked
