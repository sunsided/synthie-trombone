version: '3'

vars:
  # Build profile switching
  PROFILE: '{{ .PROFILE | default "debug" }}'                # accepts: debug|release
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  PROFILE_DIR: '{{ if eq .PROFILE "release" }}release{{ else }}debug{{ end }}'

tasks:
  default:
    cmds:
      - cmd: task --list --sort=none
        silent: true

  sort:toml:
    preconditions:
      - sh: command -v cargo-sort
        msg: "cargo-sort not found — please install via cargo install cargo-sort"
    sources:
      - Cargo.toml
      - crates/*/Cargo.toml
    cmds:
      - cargo sort --workspace

  fmt:
    desc: Format the code
    aliases:
      - format
    sources:
      - Cargo.toml
      - crates/**/*.toml
      - crates/**/*.rs
    cmds:
      - task: sort:toml
      - cargo fmt --all

  lint:
    desc: Lint the code
    cmds:
      - cargo clippy --workspace --all-targets {{.CLI_ARGS}}

  lint:fix:
    desc: Lint the code and apply fixes
    aliases:
      - fix
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-staged {{.CLI_ARGS}}
      - task: fmt

  check:
    desc: Run all checks — format, lint, compile (std and no_std)
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo check --workspace
      - task: check:no-std

  check:no-std:
    desc: Check the core crate builds without std (libm, with and without alloc)
    cmds:
      - cargo check -p synthie-trombone --no-default-features --features libm
      - cargo check -p synthie-trombone --no-default-features --features libm,alloc

  lint:actions:
    desc: Lint GitHub Actions workflows (actionlint + zizmor), same versions as CI
    preconditions:
      - sh: command -v uvx
        msg: "uvx not found — install uv from https://docs.astral.sh/uv/"
    cmds:
      - uvx --from actionlint-py==1.7.12.25 actionlint
      - uvx zizmor==1.31.1 {{.CLI_ARGS}} .

  gc:
    desc: Clean up outdated build artifacts
    preconditions:
      - sh: command -v cargo-gc
        msg: "cargo-gc not found — please install via cargo install cargo-gc-bin"
    cmds:
      - cargo gc

  sweep:
    desc: Clean outdated build artifacts by timestamp (see also gc)
    preconditions:
      - sh: command -v cargo-sweep
        msg: "cargo-sweep not found — please install via cargo install cargo-sweep"
    cmds:
      - cargo sweep --installed

  clean:
    desc: Clean all build artifacts (use sweep for a lightweight clean)
    status:
      - test ! -d target
    cmds:
      - cargo clean

  build:
    desc: Build the synthie-trombone CLI
    sources:
      - Cargo.toml
      - Cargo.lock
      - crates/**/*.rs
      - crates/**/*.toml
    generates:
      - target/{{.PROFILE_DIR}}/synthie-trombone
    requires:
      vars:
        - name: PROFILE
          enum:
            - debug
            - release
    cmds:
      - cargo build -p synthie-trombone-cli {{.PROFILE_FLAG}}

  test:
    desc: Run all tests
    env:
      RUST_LOG: disabled
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  test:docs:
    desc: Run doctests only
    env:
      RUST_LOG: disabled
    cmds:
      - cargo test --workspace --doc {{.CLI_ARGS}}

  upgrade:deps:
    desc: Upgrade the dependencies
    cmds:
      - cargo upgrade
      - cargo update

  run:
    desc: Run the synthie-trombone CLI (always release; the waveguide needs the speed)
    aliases:
      - tui
    cmds:
      - cargo run -p synthie-trombone-cli --release -- {{.CLI_ARGS}}

  install:
    desc: Install the synthie-trombone binary into ~/.cargo/bin
    cmds:
      - cargo install --locked --path crates/synthie-trombone-cli

  say:
    desc: 'Speak text into say.wav (task say -- --voice bright "Hello there!")'
    cmds:
      - cargo run -p synthie-trombone --example say --release -- {{.CLI_ARGS}}

  voices:
    desc: 'Speak a line in every preset voice into voices/*.wav (task voices -- "Welcome!")'
    cmds:
      - cargo run -p synthie-trombone --example voices --release -- {{.CLI_ARGS}}

  vowels:
    desc: Sing the vowel triangle into vowels.wav
    cmds:
      - cargo run -p synthie-trombone --example vowels --release

  formants:
    desc: Print measured F1–F3 of every vowel
    cmds:
      - cargo run -p synthie-trombone --example formants --release

  tune:vowels:
    desc: Grid-search vowel articulations against Peterson & Barney formants (takes minutes)
    cmds:
      - cargo run -p synthie-trombone --example tune_vowels --release

  screenshots:
    desc: Render README screenshots of the terminal app into docs/ (needs Chrome and ImageMagick)
    preconditions:
      - sh: command -v google-chrome
        msg: "google-chrome not found — it renders the HTML frames to PNG"
      - sh: command -v convert
        msg: "ImageMagick convert not found — it trims the screenshots"
    vars:
      FRAMES: '{{.ROOT_DIR}}/target/screenshots'
    cmds:
      - SCREENSHOT_DIR={{.FRAMES}} cargo test -p synthie-trombone-cli --release -- --ignored screenshots
      - mkdir -p docs
      - for: [singing, speaking]
        cmd: >-
          google-chrome --headless=new --disable-gpu --hide-scrollbars
          --force-device-scale-factor=2 --window-size=1200,780
          --screenshot={{.ROOT_DIR}}/docs/{{.ITEM}}.png file://{{.FRAMES}}/{{.ITEM}}.html 2>/dev/null
          && convert docs/{{.ITEM}}.png -bordercolor black -border 1 -fuzz 1% -trim +repage docs/{{.ITEM}}.png

  web:wasm:
    desc: Build the wasm engine for the web app into web/src/lib/wasm/pkg
    preconditions:
      - sh: command -v wasm-pack
        msg: "wasm-pack not found — install via cargo install wasm-pack --locked"
    sources:
      - crates/synthie-trombone/src/**/*.rs
      - crates/synthie-trombone-wasm/src/**/*.rs
      - crates/synthie-trombone-wasm/Cargo.toml
    generates:
      - web/src/lib/wasm/pkg/engine_bg.wasm
    cmds:
      - wasm-pack build crates/synthie-trombone-wasm --release --target web --out-dir ../../web/src/lib/wasm/pkg --out-name engine --no-pack

  web:install:
    desc: Install the web app's dependencies (Yarn via corepack)
    dir: web
    sources:
      - package.json
      - yarn.lock
    cmds:
      - corepack enable
      - yarn install --immutable

  web:dev:
    desc: Run the web app locally with hot reload (http://localhost:5173)
    deps: [web:wasm, web:install]
    dir: web
    cmds:
      - yarn dev {{.CLI_ARGS}}

  web:check:
    desc: Type-check the web app (svelte-check)
    deps: [web:wasm, web:install]
    dir: web
    cmds:
      - yarn check

  web:build:
    desc: Build the static site into web/build (BASE_PATH=/synthie-trombone for GitHub Pages)
    deps: [web:wasm, web:install]
    dir: web
    cmds:
      - yarn build

  triumph:
    desc: 'Sing triumph/triumph.mid with triumph/triumph.lyr (local files, not in the repo; extra options after --, e.g. task triumph -- --until 30)'
    aliases: [sing]
    preconditions:
      - sh: test -f triumph/triumph.mid && test -f triumph/triumph.lyr
        msg: "put triumph.mid and triumph.lyr into triumph/ first"
    cmds:
      - cargo build --release -p synthie-trombone-cli
      - target/release/synthie-trombone sing triumph/triumph.mid --lyrics triumph/triumph.lyr {{.CLI_ARGS}}
