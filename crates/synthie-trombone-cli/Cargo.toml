[package]
name                 = "synthie-trombone-cli"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
description          = "Pink Trombone in the terminal: play a vocal tract with keyboard and mouse, or type text and hear it spoken"
repository.workspace = true
license.workspace = true
readme               = "../../README.md"
keywords             = ["synthesizer", "speech", "vocal-tract", "tui", "text-to-speech"]
categories           = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "synthie-trombone"
path = "src/main.rs"
# The library crate of the same name owns the `synthie_trombone` docs.
doc  = false

[dependencies]
anyhow            = { workspace = true }
cpal              = { workspace = true }
crossbeam-channel = { workspace = true }
crossterm         = { workspace = true }
ratatui           = { workspace = true }
synthie           = { workspace = true }
synthie-trombone  = { path = "../synthie-trombone", version = "0.1.0" }
synthie-ui        = { workspace = true }

[lints]
workspace = true
